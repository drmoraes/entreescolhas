<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel Admin — Entre Escolhas</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" />
<style>
  :root{--bg:#08080F;--bg-card:#0F0F1E;--bg-raised:#141428;--border:rgba(108,99,255,.15);
    --accent:#6C63FF;--accent-dim:rgba(108,99,255,.12);--text:#F0EFF8;--text-2:#9490C0;--text-3:#5E5A8A;--red:#EF4444}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:600}
  input{font-family:inherit;background:var(--bg-raised);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;width:100%}
  .btn{background:var(--accent);color:#fff;padding:10px 16px;font-size:13px}
  .muted{color:var(--text-2)}.small{font-size:12px}.red{color:var(--red)}
  header{display:flex;align-items:center;gap:14px;padding:11px 22px;border-bottom:1px solid var(--border);background:color-mix(in srgb, var(--bg) 96%, transparent)}
  .brand{font-weight:800;font-size:15px}.brand span{color:var(--accent)}
  .shell{flex:1;display:flex;min-height:0}
  nav.side{width:216px;flex:none;border-right:1px solid var(--border);background:var(--bg-card);overflow-y:auto;padding:10px 10px 24px}
  nav.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:700;padding:14px 10px 6px}
  nav.side button{display:block;width:100%;text-align:left;background:transparent;color:var(--text-2);padding:9px 10px;font-size:13.5px;font-weight:500;border-radius:8px;border-left:2px solid transparent}
  nav.side button small{display:block;font-size:11px;font-weight:400;color:var(--text-3);margin-top:1px}
  nav.side button:hover{color:var(--text);background:var(--accent-dim)}
  nav.side button.on{color:var(--text);background:var(--accent-dim);border-left-color:var(--accent);font-weight:700}
  nav.side button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  @media (max-width:820px){
    .shell{flex-direction:column}
    nav.side{width:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:6px 10px}
    nav.side .grp{display:none}
    nav.side button{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;padding:9px 12px}
    nav.side button small{display:none}
    nav.side button.on{border-bottom-color:var(--accent)}
  }
  main{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .gate{max-width:380px;margin:80px auto;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:30px}
  .logout{background:transparent;border:1px solid var(--border);color:var(--text-2);padding:7px 13px;font-size:12px}
</style>
  <link rel="stylesheet" href="/theme.css?v=3">
  <script src="/theme.js?v=3"></script>
  <script src="/cookies.js?v=1" defer></script>
</head>
<body>
<div id="gate" class="gate">
  <div class="brand" style="margin-bottom:10px">Entre<span>Escolhas</span> · Painel</div>
  <p class="muted small" style="margin-bottom:14px">Entre com a ADMIN_API_KEY (chave mestra) ou seu token de usuário.</p>
  <input id="key" type="password" placeholder="Chave / token" onkeydown="if(event.key==='Enter')entrar()" />
  <button class="btn" style="width:100%;margin-top:12px" onclick="entrar()">Entrar</button>
  <div id="gErr" class="red small" style="margin-top:10px"></div>
</div>

<div id="app" style="display:none;flex-direction:column;height:100%">
  <header>
    <div class="brand">Entre<span>Escolhas</span> · Painel</div>
    <div style="flex:1"></div>
    <span id="who" class="muted small"></span>
    <button class="logout" onclick="sair()">Sair</button>
  </header>
  <div class="shell">
    <!-- Menu organizado por PERGUNTA de negócio: quem são os clientes, o que
         fizeram, o que foi liberado de graça, e o resto da operação. -->
    <nav class="side" id="tabs" aria-label="Seções do painel">
      <div class="grp" style="padding-top:6px">Clientes</div>
      <button data-tab="clientes" data-src="/admin-clientes.html" class="on">Pessoas<small>quem fez teste, pagou ou ganhou</small></button>
      <button data-tab="empresas" data-src="/admin-b2b.html?view=empresas">Empresas (RH)<small>créditos, usuários, painel 360</small></button>
      <div class="grp">Testes</div>
      <button data-tab="testes" data-src="/admin-testes.html">Testes realizados<small>resultados, reinício</small></button>
      <button data-tab="cortesias" data-src="/admin-cortesias.html">Cortesias<small>teste 100% grátis</small></button>
      <div class="grp">Banco de talentos</div>
      <button data-tab="candidatos" data-src="/admin-candidatos.html">Candidatos</button>
      <button data-tab="vagas" data-src="/admin-vagas.html">Vagas</button>
      <div class="grp">Financeiro</div>
      <button data-tab="overview" data-src="/admin-b2b.html">Indicadores B2B<small>receita, funil, auditoria</small></button>
      <button data-tab="cupons" data-src="/admin-cupons.html">Cupons de crédito</button>
      <button data-tab="afiliados" data-src="/admin-cashback.html">Afiliados</button>
      <div class="grp">Sistema</div>
      <button data-tab="config" data-src="/admin-config.html">Configurações<small>preço, modo grátis, custos</small></button>
      <button data-tab="usuarios" data-src="/admin-usuarios.html">Usuários e auditoria</button>
    </nav>
    <main><iframe id="frame" title="seção"></iframe></main>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
async function entrar(){
  const key=$('key').value.trim();
  if(!key){$('gErr').textContent='Informe a chave';return;}
  $('gErr').textContent='Verificando…';
  // valida a chave contra um endpoint admin antes de abrir o painel
  try{
    const r=await fetch('/api/b2b?fn=admin_users&op=audit',{headers:{'X-Api-Key':key}});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'Chave inválida');}
    // guarda no navegador (persiste entre sessões) — digita a senha UMA vez só
    localStorage.setItem('ee_admin_key',key);
    abrir();
  }catch(e){$('gErr').textContent=e.message;}
}
function abrir(){
  $('gate').style.display='none';$('app').style.display='flex';
  // abre a aba pedida no #hash (ex.: painel.html#candidatos), senão a primeira
  const tab=(location.hash||'').replace('#','');
  const btn=document.querySelector('#tabs button[data-tab="'+tab+'"]')||document.querySelector('#tabs button.on');
  go(btn);
}
function go(btn,extra){
  if(!btn)return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===btn));
  if(btn.dataset.tab){ try{history.replaceState(null,'','#'+btn.dataset.tab);}catch(e){} }
  $('frame').src=btn.dataset.src+(extra?(btn.dataset.src.includes('?')?'&'+extra.slice(1):extra):'');
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-src]');if(b)go(b);});
// Uma seção pode pedir para abrir outra (ex.: Clientes → "dar cortesia").
window.addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data||e.data.type!=='ee-admin-go')return;
  const b=document.querySelector('#tabs button[data-tab="'+String(e.data.tab).replace(/[^a-z-]/g,'')+'"]');
  if(!b)return;
  const extra=e.data.params?('?'+new URLSearchParams(e.data.params).toString()):'';
  go(b,extra);
});
function sair(){localStorage.removeItem('ee_admin_key');sessionStorage.removeItem('ee_admin_key');location.hash='';location.reload();}
// auto-entra se já houver chave salva (não pede senha de novo)
(function(){try{var k=localStorage.getItem('ee_admin_key')||sessionStorage.getItem('ee_admin_key');if(k){localStorage.setItem('ee_admin_key',k);abrir();}}catch(e){}})();
</script>
</body>
</html>
